# Index constituent definitions.
# These are placeholder constituents for development/testing.
# In production, the live list is loaded at runtime from the KDB+ indexMembers table
# via xqa_get_index_syms.
#
# Sym format: {ticker}.{exchange_suffix}
#   .T = Tokyo Stock Exchange
#   .O = Osaka Exchange

indices:
  TOPIX:
    name: TOPIX Core 30
    description: >
      Core constituents of the Tokyo Stock Price Index (TOPIX).
      Represents the largest, most liquid stocks on TSE.
    venue: XTKS
    rebalance: quarterly
    sym_suffix: ".T"
    # Placeholder top-30 constituents (illustrative, not guaranteed current)
    constituents:
