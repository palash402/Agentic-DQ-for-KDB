# Venue trading hours and timezone configuration.
# Times are in the storage timezone (KDB+ data timezone) unless noted.
#
# Key concept: KDB-X stores tick data in a configured "storage timezone"
# that may differ from venue local time. Always use storage_utc_offset_hours
# when filtering by time in q queries.
#
# TSE example: Tokyo local time is JST (UTC+9).
#              Data is stored as JST-1h = UTC+8.
#              So Tokyo open at 09:00 JST = 08:00 in the data.

venues:
  XTKS:
    name: Tokyo Stock Exchange
    mic: XTKS
    timezone: Asia/Tokyo
    utc_offset_hours: 9          # Venue local time = UTC+9
    storage_utc_offset_hours: 8  # Data stored as JST-1h (UTC+8)
    currency: JPY

    # All times below are in STORAGE timezone (UTC+8 = JST-1h)
    sessions:
      pre_open:
        start: "07:00"
        end: "08:00"
        description: "Pre-open / order input period (JST 08:00-09:00)"
      morning:
        start: "08:00"
        end: "10:30"
        description: "Morning continuous session (JST 09:00-11:30)"
      lunch:
        start: "10:30"
        end: "11:30"
        description: "Lunch break (JST 11:30-12:30)"
      afternoon:
        start: "11:30"
        end: "14:00"
        description: "Afternoon continuous session (JST 12:30-15:00)"
      post_close:
        start: "14:00"
        end: "15:00"
        description: "Post-close / ToSTNeT (JST 15:00-16:00)"

    auctions:
      opening:
        start: "07:00"
        end: "08:00"
        flag_value: "opening"
        description: "Opening auction — concentrated execution at 08:00 storage time"
      closing:
        start: "13:55"
        end: "14:00"
        flag_value: "closing"
        description: "Closing auction — concentrated execution at 14:00 storage time"

    notes: >
      Crossed quotes (bid >= ask) are EXPECTED during auction periods
      (pre_open and closing auction windows) due to TSE's special quotation mechanism.
      Only flag crossed quotes during continuous trading hours (morning + afternoon).

  XOSE:
    name: Osaka Exchange (derivatives)
    mic: XOSE
    timezone: Asia/Tokyo
    utc_offset_hours: 9
    storage_utc_offset_hours: 8
    currency: JPY

    sessions:
      day:
        start: "07:00"
        end: "14:30"
        description: "Day session"
      evening:
        start: "15:30"
        end: "23:30"
        description: "Evening session"

    auctions:
      opening:
        start: "07:00"
        end: "07:01"
        flag_value: "opening"
      closing:
        start: "14:29"
        end: "14:30"
        flag_value: "closing"
